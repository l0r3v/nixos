name: Build homelab
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build/Test
    runs-on: nixos-host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Nix packages
        run: nix eval ./homelab/.#nixosConfigurations.homelab.config.system.build.toplevel 

